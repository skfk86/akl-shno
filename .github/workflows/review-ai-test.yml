name: Test auto-review with local AI
on:
  push:
    branches: [main]
    paths: [notify/review.mjs, tests/review.test.mjs, tests/fake-poster.jpg, .github/workflows/review-ai-test.yml]
  workflow_dispatch:
permissions: { contents: write }
env:
  OLLAMA_MODEL: qwen2.5vl:7b
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults: { run: { working-directory: tests } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - uses: actions/cache@v4
        with: { path: ~/.ollama/models, key: "ollama-${{ env.OLLAMA_MODEL }}" }
      - name: Start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > /tmp/ollama.log 2>&1 &)
          for i in $(seq 30); do curl -s localhost:11434 >/dev/null && break; sleep 1; done
          ollama pull "$OLLAMA_MODEL"
      - name: Run auto-review tests with AI
        run: |
          set -o pipefail
          start=$(date +%s)
          npx firebase emulators:exec --project demo-akl-shno --only firestore "node review.test.mjs" 2>&1 | tee out.txt
          echo "  ⏱ $(( $(date +%s) - start )) ث" | tee -a out.txt
      - name: Post results on the commit
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          { echo "AI review test"; echo "\`\`\`"; grep -E "✓|✗|نجح|→|  ai |⏱|^      " out.txt 2>/dev/null || echo "no output"; echo "\`\`\`"; } > body.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@body.md > /dev/null
