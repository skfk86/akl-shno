name: E2E app test
on:
  push:
    branches: [main]
    paths: [www/**, firestore.rules, tests/e2e.mjs, .github/workflows/e2e.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: tests } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - run: npm install && npm install --no-save playwright@1.49.1
      - run: npx playwright install --with-deps chromium
      - name: Run end-to-end test
        run: |
          set -o pipefail
          cp ../firestore.rules firestore.rules
          npx firebase emulators:exec --project demo-akl-shno --only auth,firestore "node e2e.mjs" 2>&1 | tee e2e-out.txt
      - name: Post results on the commit
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          { echo "### فحص التطبيق الشامل"; echo '```'; cat e2e-results.txt 2>/dev/null || tail -40 e2e-out.txt; echo '```'; } > body.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@body.md > /dev/null
      - uses: actions/upload-artifact@v5
        if: always()
        with: { name: e2e-screenshots, path: tests/shots }
