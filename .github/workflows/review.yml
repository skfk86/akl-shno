name: Auto-review restaurants
# يفحص طلبات المطاعم المعلّقة بالطريقة العادية (بدون ذكاء اصطناعي): بيانات الكاميرا + تحليل البكسلات + القواعد.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency: { group: review, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: notify } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Anything to review?
        id: count
        env: { FIREBASE_SA: "${{ secrets.FIREBASE_SA }}" }
        run: echo "n=$(node review-run.mjs --count | tail -1)" >> "$GITHUB_OUTPUT"
      - name: Review
        if: steps.count.outputs.n != '0'
        env: { FIREBASE_SA: "${{ secrets.FIREBASE_SA }}" }
        run: node review-run.mjs
