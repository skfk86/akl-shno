name: Build Android
on:
  push: { branches: [main] }
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npx cap add android
      - name: google-services.json
        env: { GS: "${{ secrets.GOOGLE_SERVICES_JSON }}" }
        run: |
          if [ -z "$GS" ]; then echo "::warning::GOOGLE_SERVICES_JSON secret missing"; else echo "$GS" > android/app/google-services.json; fi
      - run: echo "ext.rgcfaIncludeGoogle = true" >> android/variables.gradle
      - run: npx cap sync android
      - name: Build
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > app/release.jks
            ./gradlew assembleRelease bundleRelease \
              -Pandroid.injected.signing.store.file=$PWD/app/release.jks \
              -Pandroid.injected.signing.store.password="$KS_PASS" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASS"
            echo "### SHA fingerprints (add to Firebase)" >> $GITHUB_STEP_SUMMARY
            keytool -list -v -keystore app/release.jks -storepass "$KS_PASS" | grep -E "SHA1|SHA256" >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning::No keystore secret, building debug only"
            ./gradlew assembleDebug
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: akl-shno-android
          path: |
            android/app/build/outputs/**/*.apk
            android/app/build/outputs/**/*.aab
