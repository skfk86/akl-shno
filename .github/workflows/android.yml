name: Build Android
on:
  push: { branches: [main] }
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npx cap add android
      - name: google-services.json
        env: { GS: "${{ secrets.GOOGLE_SERVICES_JSON }}" }
        run: |
          if [ -z "$GS" ]; then echo "::warning::GOOGLE_SERVICES_JSON secret missing"; else echo "$GS" > android/app/google-services.json; fi
      - run: printf "\next.rgcfaIncludeGoogle = true\n" >> android/variables.gradle
      - name: Location permissions
        run: |
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />#' android/app/src/main/AndroidManifest.xml
          grep -c ACCESS_FINE_LOCATION android/app/src/main/AndroidManifest.xml
      - name: Bundle fonts and map library into the app
        run: |
          npm install --no-save --no-audit --no-fund leaflet@1.9.4 @fontsource/ibm-plex-sans-arabic@5
          mkdir -p www/vendor/fonts
          cp node_modules/leaflet/dist/leaflet.js node_modules/leaflet/dist/leaflet.css www/vendor/
          cp -r node_modules/leaflet/dist/images www/vendor/
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css#vendor/leaflet.css#; s#https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js#vendor/leaflet.js#' www/index.html
          F=node_modules/@fontsource/ibm-plex-sans-arabic/files
          if ls $F/ibm-plex-sans-arabic-arabic-400-normal.woff2 >/dev/null 2>&1; then
            : > www/vendor/fonts.css
            for w in 400 500 700; do
              for sub in arabic latin; do
                cp $F/ibm-plex-sans-arabic-$sub-$w-normal.woff2 www/vendor/fonts/
                R=$([ $sub = arabic ] && echo "U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E" || echo "U+0000-00FF,U+2000-206F,U+20AC")
                printf "@font-face{font-family:'IBM Plex Sans Arabic';font-style:normal;font-weight:%s;font-display:swap;src:url(fonts/ibm-plex-sans-arabic-%s-%s-normal.woff2) format('woff2');unicode-range:%s}\n" $w $sub $w "$R" >> www/vendor/fonts.css
              done
            done
            sed -i 's#<link rel="preconnect" href="https://fonts.googleapis.com">##; s#https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap#vendor/fonts.css#' www/index.html
          else echo "::warning::font files not found, keeping Google Fonts"; fi
          grep -n "vendor/" www/index.html
      - name: App icon and splash from assets/
        run: |
          npx --yes @capacitor/assets@3 generate --android \
            --iconBackgroundColor '#FDC303' --iconBackgroundColorDark '#FDC303' \
            --splashBackgroundColor '#FDBA03' --splashBackgroundColorDark '#FDBA03'
          ls android/app/src/main/res/mipmap-xxxhdpi/
      - name: Android SDK levels (min 24, compile/target 36)
        run: |
          sed -i -E 's/(minSdkVersion\s*=\s*)[0-9]+/\124/; s/(compileSdkVersion\s*=\s*)[0-9]+/\136/; s/(targetSdkVersion\s*=\s*)[0-9]+/\136/' android/variables.gradle
          grep -E "minSdkVersion|compileSdkVersion|targetSdkVersion" android/variables.gradle
          grep -q "minSdkVersion = 24" android/variables.gradle && grep -q "targetSdkVersion = 36" android/variables.gradle && grep -q "compileSdkVersion = 36" android/variables.gradle
          { echo "### SDK levels"; echo '```'; grep -E "SdkVersion" android/variables.gradle; echo '```'; } >> $GITHUB_STEP_SUMMARY
      - name: Version from build number
        run: |
          VC=$((100 + ${{ github.run_number }}))
          VN="$(node -p 'require("./package.json").version').${{ github.run_number }}"
          sed -i "s/versionCode [0-9]*/versionCode $VC/; s/versionName \"[^\"]*\"/versionName \"$VN\"/" android/app/build.gradle
          sed -i "s/const APP_VERSION = \"[^\"]*\"/const APP_VERSION = \"$VN\"/" www/index.html
          grep -E "versionCode|versionName" android/app/build.gradle
          echo "### Version $VN (code $VC)" >> $GITHUB_STEP_SUMMARY
      - run: npx cap sync android
      - name: Build
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > app/release.jks
            ./gradlew assembleRelease bundleRelease \
              -Pandroid.injected.signing.store.file=$PWD/app/release.jks \
              -Pandroid.injected.signing.store.password="$KS_PASS" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASS"
            echo "### SHA fingerprints (add to Firebase)" >> $GITHUB_STEP_SUMMARY
            keytool -list -v -keystore app/release.jks -storepass "$KS_PASS" | grep -E "SHA1|SHA256" >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning::No keystore secret, building debug only"
            ./gradlew assembleDebug
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: akl-shno-android
          path: |
            android/app/build/outputs/**/*.apk
            android/app/build/outputs/**/*.aab
