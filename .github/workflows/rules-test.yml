name: Test Firestore rules
on:
  push:
    branches: [main]
    paths: [firestore.rules, tests/**, .github/workflows/rules-test.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rules:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: tests } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - name: Run rules tests
        run: |
          set -o pipefail
          npx firebase emulators:exec --project demo-akl-shno --only firestore "node rules.test.mjs" 2>&1 | tee out.txt
      - name: Post results on the commit
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          { echo '```'; grep -E "^  [✓✗]|^      |نجح|^[^ ].*[ء-ي]" out.txt | tail -120; echo '```'; } > body.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@body.md > /dev/null
