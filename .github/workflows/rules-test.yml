name: Test Firestore rules
on:
  push:
    branches: [main]
    paths: [firestore.rules, tests/**, notify/review.mjs, .github/workflows/rules-test.yml]
  workflow_dispatch:
permissions:
  contents: write
  models: read
jobs:
  rules:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: tests } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - name: Run rules tests
        run: |
          set -o pipefail
          cp ../firestore.rules firestore.rules
          npx firebase emulators:exec --project demo-akl-shno --only firestore "node rules.test.mjs" 2>&1 | tee out.txt
      - name: Probe GitHub Models
        if: always()
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: |
          code=$(curl -sS -o probe.txt -w "%{http_code} %{content_type}" -X POST https://models.github.ai/inference/chat/completions \
            -H "Authorization: Bearer $GITHUB_TOKEN" -H "Content-Type: application/json" -H "Accept: application/json" \
            -d '{"model":"openai/gpt-4.1-mini","messages":[{"role":"user","content":"Reply with the JSON {\"ok\":true}"}]}')
          echo "  ai probe: $code $(head -c 300 probe.txt | tr '\n' ' ')" | tee -a out.txt
      - name: Run auto-review tests
        if: always()
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: |
          set -o pipefail
          npx firebase emulators:exec --project demo-akl-shno --only firestore "node review.test.mjs" 2>&1 | tee -a out.txt
      - name: Post results on the commit
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          { echo "\`\`\`"; grep -E "✓|✗|نجح|→|المراجعة|  ai " out.txt 2>/dev/null || echo "no output"; echo "\`\`\`"; } > body.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@body.md > /dev/null
